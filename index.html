<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Развитие инструментального бенда (Диаграмма Ганта)</title>

<!-- Frappe Gantt 1.0.4 через CDN (UMD — стабильное подключение) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/frappe-gantt@1.0.4/dist/frappe-gantt.css">
<script src="https://cdn.jsdelivr.net/npm/frappe-gantt@1.0.4/dist/frappe-gantt.umd.js"></script>

<style>
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    margin: 24px;
    background: #f5f6f8;
    color: #2c3e50;
  }
  h1 { font-size: 20px; margin-bottom: 16px; }

  .toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .toolbar button {
    padding: 6px 14px;
    border: 1px solid #cfd6e0;
    background: #fff;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  .toolbar button.active {
    background: #4a90d9;
    border-color: #4a90d9;
    color: #fff;
  }

  /* контейнер: фиксированная высота + скролл */
  #gantt {
    background: #fff;
    border-radius: 8px;
    overflow: auto;
    min-height: 400px;
    max-height: 725px;
    position: relative;

    /* выходные в недельном режиме — заметнее (1.0.4: класс .holiday-highlight) */
    --g-weekend-highlight-color: #fff2ee;
  }

  /* ---------- Кастомные стили SVG ---------- */
  .gantt .grid-header { fill: #eef2f7; }
  .gantt .grid-row { fill: #fff; }
  .gantt .grid-row:nth-child(even) { fill: #f9fbfd; }

  /* полосы задач: невыполненная часть (светлая) и прогресс (насыщенный).
     Селектор .bar-wrapper .bar — та же специфичность, что у библиотеки,
     поэтому перебиваем её без !important. */
  .gantt .bar-wrapper .bar          { fill: #b2d3f6; }
  .gantt .bar-wrapper .bar-progress { fill: #2ecc71; }

  /* подписи на полосах */
  .gantt .bar-label {
    fill: #30363a;
    font-size: 12px;
    font-weight: 600;
  }
  /* текст, вынесенный наружу полосы — тёмный, чтобы не сливаться с фоном */
  .gantt .bar-label.big {
    fill: #2c3e50 !important;
  }

  /* стрелки зависимостей — правим path, а не g */
  .gantt .arrow path {
    stroke: #e74c3c !important;
    stroke-width: 2 !important;
    fill: none !important;
  }

  /* линия "сегодня" */
  .gantt .today-highlight { fill: #ffeaa7; opacity: .35; }

  /* подписи шкалы */
  .gantt .tick { stroke: #e3e8ef; }
  .gantt .upper-text, .gantt .lower-text { fill: #5a6a7e; font-size: 12px; }

  /* выходные: в 1.0.4 класс .holiday-highlight, inline fill через переменную.
     !important нужен, чтобы перебить inline style="fill: var(...)" */
  .gantt .holiday-highlight { fill: var(--g-weekend-highlight-color) !important; }

  /* ---------- Кастомные классы задач ---------- */
  .gantt .bar-wrapper.bar-critical .bar          { fill: #f5c6c6; }
  .gantt .bar-wrapper.bar-critical .bar-progress { fill: #e74c3c; }

  .gantt .bar-wrapper.bar-done .bar              { fill: #e0e0e0; }
  .gantt .bar-wrapper.bar-done .bar-progress     { fill: #27ae60; }

  /* ---------- Кастомный попап ---------- */
  .my-popup {
    padding: 10px 12px;
    min-width: 200px;
    font-size: 13px;
  }
  .my-popup h3 { margin: 0 0 6px; font-size: 14px; }
  .my-popup .row { margin: 3px 0; color: #555; }
  .my-popup .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    background: #4a90d9;
    color: #fff;
    font-size: 11px;
  }
</style>
</head>
<body>

<h1>Развитие инструментального бенда (Диаграмма Ганта)</h1>

<div class="toolbar">
  <button data-mode="Day">День</button>
  <button data-mode="Week" class="active">Неделя</button>
  <button data-mode="Month">Месяц</button>
  <button data-mode="Year">Год</button>
</div>

<div id="gantt"></div>

<script>
/* ============================================================
   1. ЛОКАЛИЗАЦИЯ
   ============================================================ */
const ru = {
  month_names: ['Январь','Февраль','Март','Апрель','Май','Июнь',
                'Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'],
  month_names_short: ['Янв','Фев','Мар','Апр','Май','Июн',
                      'Июл','Авг','Сен','Окт','Ноя','Дек'],
  day_names: ['Воскресенье','Понедельник','Вторник','Среда',
              'Четверг','Пятница','Суббота'],
  day_names_short: ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'],
};

/* ============================================================
   1b. ФОРМАТИРОВАНИЕ ДАТ ДЛЯ ПОПАПА
   ------------------------------------------------------------
   '2026-10-19' → '19 октября'
   Поддерживает также Date и строки с временем.
   ============================================================ */
const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня',
                    'июля','августа','сентября','октября','ноября','декабря'];

function formatRuDate(iso, withYear = false) {
  if (!iso) return '';
  const d = (iso instanceof Date)
    ? iso
    : new Date(String(iso).slice(0, 10) + 'T00:00:00');
  if (isNaN(d)) return String(iso);
  const base = `${d.getDate()} ${MONTHS_GEN[d.getMonth()]}`;
  return withYear ? `${base} ${d.getFullYear()}` : base;
}

/* ============================================================
   2. ЗАДАЧИ
   ============================================================ */
const tasks = [
  { id: 't1', name: 'Все плейбеки готовы', start: '2026-10-19', end: '2026-12-01', progress: 50 },
  { id: 't2', name: 'Все партии наиграны', start: '2026-10-19', end: '2026-12-15', progress: 40 },
  { id: 't3', name: 'Все песни отрепетированы', start: '2026-10-19', end: '2026-12-31', progress: 30 },
  { id: 't4', name: 'Новый микшер используется', start: '2026-10-19', end: '2026-12-01',
    progress: 0 },
  { id: 't5', name: 'Продуман разговор с залом между песнями', start: '2026-10-19', end: '2026-12-01', progress: 0 },
  { id: 't6', name: 'Сделана фотосессия', start: '2026-10-19', end: '2026-12-31', progress: 0 },
  { id: 't7', name: 'Создана группа в VK', start: '2026-10-19', end: '2026-12-31', progress: 0 },
  { id: 't8', name: 'Записаны аудио-плюсы для публикации', start: '2026-12-01', end: '2026-12-31', progress: 0 },
  { id: 't9', name: 'Записаны видео для публикации', start: '2026-12-01', end: '2026-12-31', progress: 0 },
];

/* ============================================================
   3. СТАБИЛИЗИРУЮЩИЙ МОДУЛЬ
   ------------------------------------------------------------
   Объявлен ДО new Gantt, потому что конструктор синхронно
   вызывает on_view_change, а тот зовёт stabilize.schedule().
   Делает две вещи, БЕЗ зацикливания и БЕЗ конкуренции:
     a) grid-background всегда первым в <svg> (баг 1.0.4 —
        фон рисуется поверх задач);
     b) подписи недель начинаются с понедельника (в 1.0.4
        week_start игнорируется).
   ============================================================ */
const stabilize = (() => {
  const host = document.querySelector('#gantt');
  if (!host) return { schedule: () => {} };

  const pad = n => String(n).padStart(2, '0');
  let rafId = null;

  function fixGridBackground() {
    const svg = host.querySelector('svg.gantt');
    if (!svg) return;
    const bg = svg.querySelector(':scope > .grid-background');
    // мутация ТОЛЬКО если фон реально не первый
    if (bg && svg.firstElementChild !== bg) {
      svg.insertBefore(bg, svg.firstChild);
    }
  }

  function patchWeekLabels() {
    const svg = host.querySelector('svg.gantt');
    if (!svg) return;

    svg.querySelectorAll('.lower-text[class*="date_"]').forEach(el => {
      const m = el.className.match(/date_(\d{4})-(\d{2})-(\d{2})/);
      if (!m) return;

      // локальная дата из класса (без UTC-сдвига)
      const d = new Date(+m[1], +m[2] - 1, +m[3]);
      // сдвиг к понедельнику этой недели: 0=Пн, 6=Вс
      const shift = (d.getDay() + 6) % 7;
      d.setDate(d.getDate() - shift);

      const end = new Date(d);
      end.setDate(d.getDate() + 6);

      const newText = `${pad(d.getDate())} - ${pad(end.getDate())}`;
      const iso = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      const newClass = el.className.replace(/date_\d{4}-\d{2}-\d{2}/, 'date_' + iso);

      // пишем в DOM только при реальном изменении — иначе цикл мутаций
      if (el.textContent !== newText) el.textContent = newText;
      if (el.className !== newClass)  el.className  = newClass;
    });
  }

  function run() {
    rafId = null;
    fixGridBackground();
    patchWeekLabels();
  }

  function schedule() {
    if (rafId) return;                 // уже запланировано на этот кадр
    rafId = requestAnimationFrame(run);
  }

  // один наблюдатель на контейнер (покрывает и замену <svg>)
  new MutationObserver(schedule).observe(host, { childList: true, subtree: true });

  // скролл и ресайз — без дублей
  host.addEventListener('scroll', schedule, { passive: true });
  window.addEventListener('resize', schedule);

  // первый прогон
  schedule();

  return { schedule };
})();

/* ============================================================
   4. ИНИЦИАЛИЗАЦИЯ GANTT
   ------------------------------------------------------------
   on_view_change теперь безопасно зовёт stabilize.schedule().
   ============================================================ */
const gantt = new Gantt('#gantt', tasks, {
  view_mode: 'Week',
  language: ru,
  // week_start: 1 — в 1.0.4 игнорируется, понедельник делаем патчем выше

  column_width: 70,
  bar_height: 22,
  bar_corner_radius: 5,
  padding: 20,

  lines: 'both',

  readonly: false,
  auto_move_label: true,

  custom_popup_html: (task) => `
    <div class="my-popup">
      <h3>${task.name}</h3>
      <div class="row"><span class="badge">${task.progress ?? 0}%</span></div>
      <div class="row">📅 ${formatRuDate(task.start)} — ${formatRuDate(task.end)}</div>
      ${task.dependencies ? `<div class="row">🔗 Зависит от: ${task.dependencies}</div>` : ''}
    </div>`,

  on_click: (task) => console.log('Клик по задаче:', task.id, task.name),

  on_date_change: (task, start, end) => {
    console.log('Даты изменены:', task.id, start, end);
  },

  on_progress_change: (task, progress) => {
    console.log('Прогресс изменён:', task.id, progress + '%');
  },

  on_view_change: (mode) => {
    document.querySelectorAll('.toolbar button').forEach(b => {
      b.classList.toggle('active', b.dataset.mode === mode);
    });
    stabilize.schedule();
  },
});

/* ============================================================
   5. ТУЛБАР — переключение масштаба
   ============================================================ */
document.querySelectorAll('.toolbar button').forEach(btn => {
  btn.addEventListener('click', () => {
    gantt.change_view_mode(btn.dataset.mode);
    stabilize.schedule();
    // один страховочный проход после анимации Gantt (0.4s)
    setTimeout(stabilize.schedule, 120);
  });
});

</script>

</body>
</html>
